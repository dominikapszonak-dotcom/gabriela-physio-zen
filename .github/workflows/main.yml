name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Find built website
        run: |
          echo "Looking for generated website files..."
          find . -maxdepth 5 -type f -name "index.html" -print

      - name: Prepare GitHub Pages
        run: |
          mkdir -p site

          if [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
            cp -R .output/public/. site/
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            cp -R dist/. site/
          else
            echo "ERROR: Could not find a static website output."
            echo "Contents of .output:"
            ls -la .output 2>/dev/null || true
            echo "Contents of project:"
            ls -la
            exit 1
          fi

          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
